name: Validate plugin

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "st4ck/**"
      - "plugins/st4ck-lite/**"
      - "codex/**"
      - "scripts/validate-plugin.mjs"
      - "README.md"
      - ".github/workflows/validate-plugin.yml"
  push:
    branches:
      - main
    paths:
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "st4ck/**"
      - "plugins/st4ck-lite/**"
      - "codex/**"
      - "scripts/validate-plugin.mjs"
      - "README.md"
      - ".github/workflows/validate-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ST4CK_LITE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.78

      - name: Install Codex CLI validator
        run: npm install --global @openai/codex@0.148.0

      - name: Validate Claude marketplace and plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate st4ck

      - name: Validate native Codex packaging, versions, and Browse contracts
        run: node scripts/validate-plugin.mjs

      - name: Exercise native Codex marketplace installation
        env:
          CODEX_HOME: ${{ runner.temp }}/st4ck-codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin add st4ck-lite@st4ck-lite-marketplace --json

      - name: Check patch whitespace
        run: git diff --check "$ST4CK_LITE_BASE_REF"...HEAD
